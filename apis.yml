name: Infervision
description: >-
  Infervision is a medical artificial intelligence company that builds AI-powered
  medical imaging and clinical decision-support software for hospitals and healthcare
  providers. Its InferRead diagnostic suite assists radiologists with CT and DR
  reading across lung nodule detection, chest abnormality detection, coronary artery
  stenosis, stroke and hemorrhage triage, rib fracture identification, and pneumonia
  triage, while the InferOperate suite provides 3D reconstruction for thoracic, liver,
  and urological surgical planning. Additional platforms include InferCare for patient
  management and image follow-up, InferScholar for AI-enabled medical research, and
  the InferMatrix medical application platform. The company holds FDA 510(k) clearance
  for InferRead CT Lung, has filed 380+ patents and published 330+ peer-reviewed
  papers, and operates across 30+ countries. Infervision was surfaced through the
  API Evangelist network as a portfolio company of Qiming Venture Partners.
